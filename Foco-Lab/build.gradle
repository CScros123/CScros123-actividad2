// Versiones de plugins declaradas una sola vez para todo el proyecto (Foco + Lab).
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.kapt' version '1.9.25' apply false
    // Formato automático del código: ./gradlew spotlessApply (ver docs/MAPA-DEL-CODIGO.md).
    id 'com.diffplug.spotless' version '6.25.0'
}

// Un solo estilo para todo el código: Kotlin con ktfmt (estilo kotlinlang, 4 espacios) y Java con google-java-format (estilo AOSP,
// 4 espacios). `spotlessApply` lo reformatea; `spotlessCheck` avisa si algo quedó sin formatear. Solo toca el formato, nunca la lógica.
subprojects {
    apply plugin: 'com.diffplug.spotless'
    spotless {
        kotlin {
            target 'src/**/*.kt'
            ktfmt('0.53').kotlinlangStyle()
        }
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.24.0').aosp().reflowLongStrings(false)
        }
    }
}

// Compilación rápida para probar en el teléfono: `./gradlew :app:assemblePerf -Prapido` salta la
// revisión de lint de release ("lintVital…"), que en :lab podía tardar más de 15 min. La versión
// release (sin -Prapido) sigue pasando lint como siempre.
subprojects {
    tasks.configureEach { t ->
        if (rootProject.hasProperty('rapido') && t.name.startsWith('lintVital')) t.enabled = false
    }
}
